tags:
- netwirkProfile
description: |
  This endpoint creates or updates an event
summary: This endpoint creates or updates an event
parameters:
        - in: body
          name: body
          description: Create or update an event
          schema:
            type: object
            properties:
                  eventId:
                    type: integer
                    description: eventId
                    example: "1"
                  userId:  
                    type: integer
                    description: userId
                    example: 5
                  eventName:
                    type: varchar
                    description: eventName
                    example: "Python Workshop"
                  eventStartTime:
                    type: varchar
                    description: eventStartTime
                    example: "2024-06-12 10:00:00"
                  eventEndTime:
                    type: varchar
                    description: eventEndTime
                    example: "2024-06-13 17:00:00"
                  description:
                    type: varchar
                    description: description
                    example: "Join us for an interactive Python workshop!"
                  isPrivate:
                    type: boolean
                    description: isPrivate
                    example: On
                  location:
                    type: varchar
                    description: location
                    example: "Pune"
                  latitude:
                    type: double
                    description: latitude
                    example: 19.222294
                  longitude:
                    type: double
                    description: longitude
                    example: 73.129324
                  autoCheckoutRadius:
                    type: integer
                    description: autoCheckoutRadius
                    example: 200
                  
                  
              
responses:
  200:
    description: Success
  400:
    description: Invalid request body
  401:
    description: Unauthorized
  500:
    description: Internal server error
