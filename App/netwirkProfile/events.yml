tags:
  - netwirkProfile
summary: Stream user check-in events
description: Establishes a Server-Sent Events (SSE) connection to receive real-time check-in notifications.
operationId: events
produces:
  - text/event-stream
responses:
  200:
    description: SSE stream of check-in events
    schema:
      type: string
      example: |
        data: {"event":"new_checkin","user_id":123,"fullName":"John Doe","currentDesignation":"Software Engineer","placeId":"ChIJRVR9ciHP5zsRtrFD4nhXuBQ","checkinTime":"2025-05-29T11:44:00.123456"}
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        error:
          type: string