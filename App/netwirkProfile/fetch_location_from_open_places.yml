tags:
- netwirkProfile
description: |
  This fetches nearby places from the Open Places API
summary: Gather locations from Open Places
parameters:
        - in: body
          name: body
          description: Get locations
          schema:
            type: object
            properties:
                  latitude:
                    type: double
                    description: latitude
                    example: 12.7758157
                  radius:
                    type: int
                    description: radius in meters
                    example: 1000
                  longitude:
                    type: double
                    description: longtitude
                    example: 80.2154078
                  userId:
                    type: integer
                    description: userId
                    example: 108
                  query:
                    type: string
                    description: optional place search text
                    example: cafe
                  category:
                    type: string
                    description: optional Overture category such as restaurant
                    example: restaurant

              
responses:
  200:
    description: Data retrieved successfully
  400:
    description: Invalid request body
  401:
    description: Unauthorized
  500:
    description: Internal server error
