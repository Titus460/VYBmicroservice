tags:
- netwirkProfile
description: |
  This fetches nearby places from the local Overture database
summary: Gather locations from Overture
parameters:
        - in: body
          name: body
          description: Get locations
          schema:
            type: object
            properties:
                  latitude:
                    type: double
                    description: latitude
                    example: 33.1077656
                  radius:
                    type: int
                    description: radius in meters
                    example: 150
                  longitude:
                    type: double
                    description: longtitude
                    example: -96.8286337
                  userId:
                    type: integer
                    description: userId
                    example: 5

              
responses:
  200:
    description: Data retrieved successfully
  400:
    description: Invalid request body
  401:
    description: Unauthorized
  500:
    description: Internal server error
