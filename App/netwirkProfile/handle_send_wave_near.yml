tags:
  - netwirkProfile
description: |
  This endpoint creates or triggers a wave action for a user in who's near.
summary: Create or trigger a wave
parameters:
  - in: body
    name: body
    description: Wave details
    required: true
    schema:
      type: object
      properties:
        loginUserId:
          type: integer
          description: ID of the user sending the wave
          example: 101
        wavedToUserId:
          type: integer
          description: ID of the user receiving the wave
          example: 202
        status:
          type: varchar
          description: status
          example: "wave"

responses:
  200:
    description: Wave action executed successfully
  400:
    description: Invalid request body
  401:
    description: Unauthorized
  404:
    description: Wave not found
  500:
    description: Internal server error