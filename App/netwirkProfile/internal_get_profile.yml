tags:
- profile-internal
summary: Internal lookup of one profile (service-to-service)
description: |
  Used by other microservices instead of querying icebreaker.profile.
  Not for the mobile app. Send X-Internal-Key when INTERNAL_API_KEY is set.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          example: 1
responses:
  200:
    description: Success
  400:
    description: userId missing
  401:
    description: Unauthorized
  404:
    description: Profile not found
  500:
    description: Internal server error
