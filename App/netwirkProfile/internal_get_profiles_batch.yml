tags:
- profile-internal
summary: Internal batch lookup of profiles (service-to-service)
description: |
  Used by other microservices instead of JOIN icebreaker.profile.
  Not for the mobile app. Send X-Internal-Key when INTERNAL_API_KEY is set.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
responses:
  200:
    description: Success
  400:
    description: userIds missing
  401:
    description: Unauthorized
  500:
    description: Internal server error
