tags:
- social-internal
summary: Internal later-remaining count
description: |
  Used by recsys instead of querying icebreaker.hidden_users_1day.
  Not for the mobile app. Send X-Internal-Key when INTERNAL_API_KEY is set.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          example: 1
responses:
  200:
    description: Success
  400:
    description: userId missing
  401:
    description: Unauthorized
  500:
    description: Internal server error
