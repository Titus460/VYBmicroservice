tags:
- netwirkProfile
description: |
  This endpoint takes user id and image as input.
summary: Upload profile pic endpoint
parameters:
          - in: formData
            name: userId
            description: User ID
            required: true
            type: integer
          - in: formData
            name: image
            description: image
            required: true
            type: file
            format: binary
          
              
responses:
  200:
    description: Profile picture updated successfully
  400:
    description: Invalid request body
  401:
    description: Unauthorized
  500:
    description: Internal server error
