tags:
- registration
description: |
  Resend OTP to the user's phone number (same as send_phone_otp).
summary: resend phone OTP endpoint
parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - countryCode
              - phoneNo
            properties:
                  countryCode:
                    type: string
                    example: "+91"
                  phoneNo:
                    type: string
                    example: "9876543210"
responses:
  200:
    description: Success
  400:
    description: Invalid request body
  500:
    description: Internal server error
