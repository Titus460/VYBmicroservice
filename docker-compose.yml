# Runs the API as separate microservices behind one nginx gateway.
#   docker compose up --build
#   curl http://localhost:8080/gateway/health
# Settings come from .env (see .env.example); runtime JSON configs go in ./secrets/.

x-service: &service
  image: vybr-api:local
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - ./secrets:/var/run/secrets/vyb:ro
  depends_on:
    - redis
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s

x-env: &env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-only}
  REDIS_URL: redis://redis:6379/0
  VIBR_REGISTRATION_CONFIG_FILE: /var/run/secrets/vyb/vibr_registration_config.json
  VIBR_CONFIG_FILE: /var/run/secrets/vyb/vibr_config.json
  FIREBASE_SERVICE_ACCOUNT_FILE: /var/run/secrets/vyb/firebase-admin.json
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8000}
  PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL:-http://profile:8000}
  SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL:-http://social:8000}
  GEO_SERVICE_URL: ${GEO_SERVICE_URL:-http://geo:8000}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  auth:
    <<: *service
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.auth_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: auth
      AUTH_DB_HOST: ${AUTH_DB_HOST:-}
      AUTH_DB_PORT: ${AUTH_DB_PORT:-3306}
      AUTH_DB_USER: ${AUTH_DB_USER:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-icebreaker}

  profile:
    <<: *service
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.profile_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: profile
      PROFILE_DB_HOST: ${PROFILE_DB_HOST:-}
      PROFILE_DB_PORT: ${PROFILE_DB_PORT:-3306}
      PROFILE_DB_USER: ${PROFILE_DB_USER:-}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:-}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME:-icebreaker}

  geo:
    <<: *service
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.geo_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: geo

  social:
    <<: *service
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.social_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: social
      SOCIAL_DB_HOST: ${SOCIAL_DB_HOST:-}
      SOCIAL_DB_PORT: ${SOCIAL_DB_PORT:-3306}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-}
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-icebreaker}

  recsys:
    <<: *service
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.recsys_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: recsys

  legacy:
    <<: *service
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "services.legacy_app:app"]
    environment:
      <<: *env
      SERVICE_NAME: legacy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - profile
      - geo
      - social
      - recsys
      - legacy
