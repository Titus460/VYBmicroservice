apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-resources
  namespace: vyb-development
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: development-quota
  namespace: vyb-development
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "4"
    pods: "30"
---
