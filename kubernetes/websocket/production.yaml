apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyb-websocket
  namespace: vyb-production
  labels:
    app.kubernetes.io/name: vyb-websocket
    app.kubernetes.io/part-of: vyb
    environment: production
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyb-websocket
  namespace: vyb-production
  labels:
    app.kubernetes.io/name: vyb-websocket
    app.kubernetes.io/part-of: vyb
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vyb-websocket
      environment: production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vyb-websocket
        app.kubernetes.io/part-of: vyb
        environment: production
    spec:
      serviceAccountName: vyb-websocket
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: websocket
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8765
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_PORT
            - name: DB_READ_HOST
              value: mysql-read.vyb-production-database.svc.cluster.local
            - name: DB_READ_PORT
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: vyb-db-secrets
                  key: DB_NAME
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      imagePullSecrets:
        - name: registry-vyb
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vyb-websocket
  namespace: vyb-production
  labels:
    app.kubernetes.io/name: vyb-websocket
    environment: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vyb-websocket
    environment: production
  ports:
    - name: websocket
      port: 8765
      targetPort: websocket
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vyb-websocket
  namespace: vyb-production
  labels:
    app.kubernetes.io/name: vyb-websocket
    environment: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: jmeterprod.vib-r.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vyb-websocket
                port:
                  number: 8765
  tls:
    - hosts:
        - jmeterprod.vib-r.com
      secretName: jmeterprod-vib-r-com-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vyb-websocket
  namespace: vyb-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vyb-websocket
      environment: production
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vyb-websocket
  namespace: vyb-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vyb-websocket
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vyb-websocket
  namespace: vyb-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vyb-websocket
      environment: production
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - port: 8765
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vyb-production-database
      ports:
        - port: 3306
          protocol: TCP


