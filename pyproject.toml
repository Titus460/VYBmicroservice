[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "reports",
]

[tool.ruff.lint]
# Start with correctness rules that can safely block this legacy application.
# The full Ruff report is still published so the rule set can be tightened
# incrementally without hiding existing debt.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["Model.db_routing"]

[tool.coverage.report]
show_missing = true
skip_covered = false
